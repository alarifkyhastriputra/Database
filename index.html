<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERCU OTG</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1e1e2f;
  --primary:#6c5ce7;
}

body.dark{
  --bg:#121212;
  --card:#1e1e2f;
  --text:#ffffff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif;
}

.header{
  background:var(--primary);
  color:white;
  padding:18px;
  text-align:center;
  font-weight:bold;
  position:relative;
  font-size:20px;
}

.mode,.lock{
  position:absolute;
  top:15px;
  cursor:pointer;
  font-size:20px;
}

.mode{
  left:15px;
}

.lock{
  right:15px;
}

.container{
  max-width:520px;
  margin:auto;
  padding:15px;
}

.card{
  background:var(--card);
  padding:16px;
  border-radius:14px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}

button{
  background:var(--primary);
  color:white;
  border:none;
  cursor:pointer;
}

.option{
  background:#eef;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}

.previewGambar{
  width:100%;
  margin-top:10px;
  border-radius:12px;
}

#overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  align-items:center;
  justify-content:center;
  z-index:999;
}

.popup{
  width:90%;
  max-width:400px;
  display:none;
}

#toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  opacity:0;
  transition:0.3s;
  z-index:9999;
}

#toast.show{
  opacity:1;
  bottom:50px;
}

</style>
</head>

<body>

<div class="header">

HERCU OTG

<span class="mode" onclick="toggleMode()">🌙</span>

<span class="lock" onclick="bukaGuru()">🔒</span>

</div>

<div id="overlay" onclick="tutupPopup()">

<div id="popupGuru"
class="card popup"
onclick="event.stopPropagation()">

<h3>Login / Daftar Guru</h3>

<input id="guruNama"
placeholder="Nama Guru">

<input id="guruPass"
type="password"
placeholder="Password">

<button onclick="loginGuru()">
Login
</button>

<button onclick="daftarGuru()">
Daftar
</button>

</div>

<div id="popupConfirm"
class="card popup"
onclick="event.stopPropagation()">

<h3 id="confirmText">
Yakin?
</h3>

<button onclick="yesConfirm()">
Ya
</button>

<button onclick="tutupPopup()">
Batal
</button>

</div>

</div>

<div class="container">

<div id="loginBox" class="card">

<h3>Login Murid</h3>

<input id="namaInput"
placeholder="Nama Lengkap">

<input id="kodeRoomMurid"
placeholder="Kode Room">

<button onclick="login()">
Masuk
</button>

</div>

<div id="menuBox"></div>

<div id="contentBox"></div>

</div>

<div id="toast"></div>

<script>

const firebaseConfig={
apiKey:"AIzaSy...",
databaseURL:"https://projectchat01-d16bc-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let user="";
let role="";
let guruId="";
let currentMapel="";
let soalRandom=[];
let sudahKirim=false;
let confirmAction=null;

function showToast(msg){

let toast=document.getElementById("toast");

toast.innerText=msg;

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2000);

}

function bukaPopup(id){

overlay.style.display="flex";

document.querySelectorAll(".popup").forEach(p=>{
p.style.display="none";
});

document.getElementById(id).style.display="block";

}

function tutupPopup(){

overlay.style.display="none";

}

function showConfirm(text,action){

confirmText.innerText=text;

confirmAction=action;

bukaPopup("popupConfirm");

}

function yesConfirm(){

if(confirmAction){
confirmAction();
}

tutupPopup();

}

function toggleMode(){

document.body.classList.toggle("dark");

}

function bukaGuru(){

bukaPopup("popupGuru");

}

function daftarGuru(){

let nama=guruNama.value.trim();

let pass=guruPass.value.trim();

if(!nama || !pass){
return showToast("Isi semua!");
}

db.ref("guru").once("value",snap=>{

let data=snap.val();

if(data){

for(let id in data){

if(data[id].nama===nama){
return showToast("Nama sudah dipakai!");
}

}

}

let id="guru_"+Date.now();

db.ref("guru/"+id).set({
nama:nama,
pass:pass
}).then(()=>{

showToast("Akun dibuat!");

});

});

}

function loginGuru(){

let nama=guruNama.value.trim();

let pass=guruPass.value.trim();

db.ref("guru").once("value",snap=>{

let data=snap.val();

if(!data){
return showToast("Belum ada akun!");
}

let ketemu=false;

for(let id in data){

let d=data[id];

if(d.nama===nama && d.pass===pass){

ketemu=true;

guruId=id;

user=d.nama;

role="guru";

loginBox.style.display="none";

tutupPopup();

menuBox.innerHTML=`

<div class="card">

👨‍🏫 ${user}

<button onclick="buatMapel()">
➕ Buat Room Ujian
</button>

<button onclick="kelolaMapel()">
⚙️ Kelola Mapel
</button>

<button onclick="lihatHasil()">
📊 Hasil
</button>

</div>

`;

}

}

if(!ketemu){
showToast("Login gagal!");
}

});

}

function login(){

user=namaInput.value.trim();

let kode=kodeRoomMurid.value.trim();

if(!user){
return showToast("Isi nama!");
}

if(!kode){
return showToast("Isi kode room!");
}

db.ref("ulangan/mapel").once("value",snap=>{

let data=snap.val();

let ketemu=false;

for(let id in data){

let d=data[id];

if(d.kode.toLowerCase()===kode.toLowerCase()){

if(d.lock){
return showToast("Room dikunci!");
}

ketemu=true;

currentMapel=id;

loginBox.style.display="none";

mulaiSoal(id,d.nama);

}

}

if(!ketemu){
showToast("Kode salah!");
}

});

}

function buatMapel(){

contentBox.innerHTML=`

<div class="card">

<h3>Buat Room Ujian</h3>

<input id="mapelInput"
placeholder="Nama Mapel">

<input id="kodeRoomInput"
placeholder="Kode Room">

<button onclick="simpanMapel()">
Simpan
</button>

</div>

`;

}

function simpanMapel(){

let nama=mapelInput.value.trim();

let kode=kodeRoomInput.value.trim();

if(!nama){
return showToast("Isi nama mapel!");
}

if(!kode){
return showToast("Isi kode room!");
}

db.ref("ulangan/mapel").once("value",snap=>{

let data=snap.val();

let sama=false;

if(data){

for(let id in data){

if(data[id].kode.toLowerCase()===kode.toLowerCase()){
sama=true;
}

}

}

if(sama){
return showToast("Kode room sudah dipakai!");
}

db.ref("ulangan/mapel").push({

nama:nama,
kode:kode,
lock:false,
owner:guruId,
guru:user

}).then(()=>{

showToast("Mapel dibuat!");

kelolaMapel();

});

});

}

function kelolaMapel(){

db.ref("ulangan/mapel").once("value",snap=>{

let data=snap.val();

let html="";

if(!data){

html="<div class='card'>Belum ada mapel</div>";

}else{

for(let id in data){

let d=data[id];

if(d.owner!==guruId) continue;

html+=`

<div class="card">

<b>${d.nama}</b><br><br>

Kode : ${d.kode}<br><br>

${d.lock?"🔒 Dikunci":"🔓 Dibuka"}

<button onclick="cekKodeGuru('${id}','${d.kode}','soal')">
✏️ Kelola Soal
</button>

<button onclick="toggleLock('${id}',${d.lock})">
🔐 Lock
</button>

<button onclick="cekKodeGuru('${id}','${d.kode}','hapus')">
🗑️ Hapus
</button>

</div>

`;

}

}

contentBox.innerHTML=html;

});

}

function cekKodeGuru(id,kode,aksi){

contentBox.innerHTML=`

<div class="card">

<h3>Masukkan Kode Room</h3>

<input id="cekKodeInput"
placeholder="Kode Room">

<button onclick="verifikasiKodeGuru(
'${id}',
'${kode}',
'${aksi}'
)">
Lanjut
</button>

<button onclick="kelolaMapel()">
Batal
</button>

</div>

`;

}

function verifikasiKodeGuru(id,kode,aksi){

let input=document
.getElementById("cekKodeInput")
.value
.trim();

if(input!==kode){
return showToast("Kode salah!");
}

if(aksi==="soal"){

halamanSoal(id);

}else{

showConfirm("Hapus mapel?",()=>{

db.ref("ulangan/mapel/"+id)
.remove()
.then(()=>{

showToast("Dihapus");

kelolaMapel();

});

});

}

}

function toggleLock(id,lock){

db.ref("ulangan/mapel/"+id+"/lock")
.set(!lock)
.then(()=>{

kelolaMapel();

});

}

function halamanSoal(id){

currentMapel=id;

db.ref("ulangan/mapel/"+id+"/soal")
.once("value",snap=>{

let data=snap.val();

let html="<div id='soalContainer'></div>";

html+=`

<button onclick="tambahSoal()">
➕ Tambah Soal
</button>

<button onclick="simpanSoal()">
💾 Simpan
</button>

<button onclick="kelolaMapel()">
⬅️ Kembali
</button>

`;

contentBox.innerHTML=html;

let c=document.getElementById("soalContainer");

if(!data){
return;
}

for(let key in data){

let d=data[key];

let div=document.createElement("div");

div.className="card soalCard";

div.innerHTML=`

<select class="tipe"
onchange="ubahTipe(this)">

<option value="pg"
${d.tipe=="pg"?"selected":""}>
PG
</option>

<option value="isian"
${d.tipe=="isian"?"selected":""}>
Isian
</option>

</select>

<input class="soal"
value="${d.soal||""}"
placeholder="Pertanyaan">

<input class="gambar"
value="${d.gambar||""}"
placeholder="Link gambar"
oninput="previewGambar(this)">

<input type="file"
accept="image/*"
onchange="uploadGambar(this)">

<img class="previewGambar"
src="${d.gambar||""}"
style="
display:${d.gambar?"block":"block"};
">

<div class="pgBox"
style="display:${d.tipe=="pg"?"block":"none"}">

<input class="a"
value="${d.a||""}"
placeholder="Jawaban A">

<input class="b"
value="${d.b||""}"
placeholder="Jawaban B">

<input class="c"
value="${d.c||""}"
placeholder="Jawaban C">

<input class="d"
value="${d.d||""}"
placeholder="Jawaban D">

<select class="jawaban">

<option ${d.benar=="A"?"selected":""}>A</option>
<option ${d.benar=="B"?"selected":""}>B</option>
<option ${d.benar=="C"?"selected":""}>C</option>
<option ${d.benar=="D"?"selected":""}>D</option>

</select>

</div>

<div class="isianBox"
style="display:${d.tipe=="isian"?"block":"none"}">

<input class="jawabanIsian"
value="${d.benar||""}"
placeholder="Jawaban benar">

</div>

<button onclick="hapusSoal('${key}')">
🗑️ Hapus Soal
</button>

`;

c.appendChild(div);

}

});

}

function ubahTipe(el){

let p=el.parentElement;

p.querySelector(".pgBox").style.display=
el.value=="pg" ? "block":"none";

p.querySelector(".isianBox").style.display=
el.value=="isian" ? "block":"none";

}

function previewGambar(input){

let parent=input.parentElement;

let img=parent.querySelector(".previewGambar");

if(input.value.trim()!=""){

img.src=input.value;

img.style.display="block";

}else{

img.style.display="none";

}

}

function uploadGambar(input){

let file=input.files[0];

if(!file) return;

let reader=new FileReader();

reader.onload=function(e){

let parent=input.parentElement;

parent.querySelector(".gambar").value=e.target.result;

let img=parent.querySelector(".previewGambar");

img.src=e.target.result;

img.style.display="block";

};

reader.readAsDataURL(file);

}

function tambahSoal(){

let c=document.getElementById("soalContainer");

let div=document.createElement("div");

div.className="card soalCard";

div.innerHTML=`

<select class="tipe"
onchange="ubahTipe(this)">

<option value="pg">PG</option>
<option value="isian">Isian</option>

</select>

<input class="soal"
placeholder="Pertanyaan">

<input class="gambar"
placeholder="Link gambar"
oninput="previewGambar(this)">

<input type="file"
accept="image/*"
onchange="uploadGambar(this)">

<img class="previewGambar"
style="display:none;">

<div class="pgBox">

<input class="a"
placeholder="Jawaban A">

<input class="b"
placeholder="Jawaban B">

<input class="c"
placeholder="Jawaban C">

<input class="d"
placeholder="Jawaban D">

<select class="jawaban">

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>

</select>

</div>

<div class="isianBox"
style="display:none;">

<input class="jawabanIsian"
placeholder="Jawaban benar">

</div>

`;

c.appendChild(div);

}

function simpanSoal(){

let cards=document.querySelectorAll(".soalCard");

db.ref("ulangan/mapel/"+currentMapel+"/soal")
.remove()
.then(()=>{

cards.forEach(c=>{

let tipe=c.querySelector(".tipe").value;

let data={

soal:c.querySelector(".soal").value,

tipe:tipe,

gambar:c.querySelector(".gambar").value

};

if(tipe=="pg"){

data.a=c.querySelector(".a").value;
data.b=c.querySelector(".b").value;
data.c=c.querySelector(".c").value;
data.d=c.querySelector(".d").value;

data.benar=
c.querySelector(".jawaban").value;

}else{

data.benar=
c.querySelector(".jawabanIsian")
.value
.toLowerCase();

}

db.ref("ulangan/mapel/"+currentMapel+"/soal")
.push(data);

});

showToast("Soal disimpan!");

});

}

function hapusSoal(id){

showConfirm("Hapus soal?",()=>{

db.ref("ulangan/mapel/"+currentMapel+"/soal/"+id)
.remove()
.then(()=>{

halamanSoal(currentMapel);

});

});

}

function shuffle(a){

for(let i=a.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[a[i],a[j]]=[a[j],a[i]];

}

}

function mulaiSoal(id,nama){

sudahKirim=false;

db.ref("ulangan/mapel/"+id+"/soal")
.once("value",snap=>{

let data=snap.val();

if(!data){

contentBox.innerHTML=
"<div class='card'>Belum ada soal</div>";

return;

}

soalRandom=Object.values(data);

shuffle(soalRandom);

let html="<h3>"+nama+"</h3>";

soalRandom.forEach((d,i)=>{

html+=`

<div class="card">

${i+1}. ${d.soal}

${d.gambar ?

`<img src="${d.gambar}"
style="
width:100%;
margin-top:10px;
border-radius:12px;
">`

:""}

`;

if(d.tipe=="pg"){

let opsi=[
{k:"A",t:d.a},
{k:"B",t:d.b},
{k:"C",t:d.c},
{k:"D",t:d.d}
];

shuffle(opsi);

opsi.forEach(o=>{

html+=`

<div class="option">

<input type="radio"
name="q${i}"
value="${o.k}">

${o.t}

</div>

`;

});

}else{

html+=`
<input id="q${i}">
`;

}

html+="</div>";

});

html+=`

<button onclick="kirim(
'${nama}',
${soalRandom.length}
)">

✅ Selesai

</button>

`;

contentBox.innerHTML=html;

});

}

function kirim(mapel,total){

if(sudahKirim) return;

sudahKirim=true;

let benar=0;

let detailJawaban=[];

soalRandom.forEach((d,i)=>{

let jawabanMurid="";

let status=false;

if(d.tipe=="pg"){

let p=document.querySelector(
'input[name=q'+i+']:checked'
);

if(p){

jawabanMurid=p.value;

if(p.value===d.benar){

benar++;
status=true;

}

}

}else{

let isi=document
.getElementById("q"+i)
.value
.toLowerCase()
.trim();

jawabanMurid=isi;

let arr=d.benar.split(",");

if(arr.includes(isi)){

benar++;
status=true;

}

}

detailJawaban.push({

soal:d.soal,
gambar:d.gambar || "",
jawaban:jawabanMurid,
benar:d.benar,
status:status,
tipe:d.tipe,

a:d.a || "",
b:d.b || "",
c:d.c || "",
d:d.d || ""

});

});

let nilai=Math.round((benar/total)*100);

db.ref(
"ulangan/mapel/"+currentMapel
)
.once("value",snap=>{

let data=snap.val();

db.ref(
"ulangan/hasil/"
+data.owner+"/"
+mapel+"/clear"
).push({

nama:user,
nilai:nilai,
guru:data.guru,
jawaban:detailJawaban

});

contentBox.innerHTML=`

<div class="card">

<h2>Nilai : ${nilai}</h2>

</div>

`;

});

}

function lihatHasil(){

db.ref("ulangan/hasil/"+guruId)
.once("value",snap=>{

let data=snap.val();

let html="";

if(!data){

html="<div class='card'>Belum ada hasil</div>";

}else{

for(let mapel in data){

html+=`

<div class="card"
onclick="lihatDetailMapel('${mapel}')">

<b>${mapel}</b>

</div>

`;

}

}

contentBox.innerHTML=html;

});

}

function lihatDetailMapel(mapel){

db.ref(
"ulangan/hasil/"+guruId+"/"+mapel
)
.once("value",snap=>{

let data=snap.val();

let html=`

<button onclick="lihatHasil()">
⬅️ Kembali
</button>

<h3>${mapel}</h3>

`;

html+=`
<div class="card">
<h3>✅ CLEAR</h3>
</div>
`;

if(data && data.clear){

for(let id in data.clear){

let d=data.clear[id];

html+=`

<div class="card">

${d.nama} - ${d.nilai}

<button onclick='lihatJawaban(${JSON.stringify(JSON.stringify(d.jawaban || []))})'>
📄 Lihat Jawaban
</button>

<button onclick="hapusHasil(
'${mapel}',
'clear',
'${id}'
)">
🗑️
</button>

</div>

`;

}

}else{

html+=`
<div class="card">
Belum ada clear
</div>
`;

}

html+=`
<div class="card">
<h3>⚠️ UNCLEAR</h3>
</div>
`;

if(data && data.unclear){

for(let id in data.unclear){

let d=data.unclear[id];

html+=`

<div class="card">

${d.nama} - ${d.nilai}

<br>Auto Submit

<button onclick="hapusHasil(
'${mapel}',
'unclear',
'${id}'
)">
🗑️
</button>

</div>

`;

}

}else{

html+=`
<div class="card">
Belum ada unclear
</div>
`;

}

contentBox.innerHTML=html;

});

}

function lihatJawaban(data){

let jawaban=JSON.parse(data);

let html=`

<button onclick="lihatHasil()">
⬅️ Kembali
</button>

<h3>Detail Jawaban</h3>

`;

jawaban.forEach((j,i)=>{

html+=`

<div class="card">

<b>${i+1}. ${j.soal}</b>

${j.gambar ?

`<img src="${j.gambar}"
style="
width:100%;
margin-top:10px;
border-radius:12px;
">`

:""}

`;

if(j.tipe=="pg"){

html+=`

<div class="option">
A. ${j.a}
</div>

<div class="option">
B. ${j.b}
</div>

<div class="option">
C. ${j.c}
</div>

<div class="option">
D. ${j.d}
</div>

`;

}

html+=`

<br>

Jawaban Murid :
<b>${j.jawaban || "-"}</b>

<br><br>

Jawaban Benar :
<b>${j.benar}</b>

<br><br>

${j.status
? "✅ Benar"
: "❌ Salah"}

</div>

`;

});

contentBox.innerHTML=html;

}

function hapusHasil(mapel,jenis,id){

showConfirm("Hapus hasil?",()=>{

db.ref(
"ulangan/hasil/"
+guruId+"/"
+mapel+"/"
+jenis+"/"
+id
)
.remove()
.then(()=>{

lihatDetailMapel(mapel);

});

});

}

function autoSubmit(){

if(!sudahKirim && soalRandom.length>0){

sudahKirim=true;

db.ref(
"ulangan/mapel/"+currentMapel
)
.once("value",snap=>{

let data=snap.val();

db.ref(
"ulangan/hasil/"
+data.owner+"/"
+data.nama+"/unclear"
).push({

nama:user,
nilai:0,
guru:data.guru,
auto:true

});
